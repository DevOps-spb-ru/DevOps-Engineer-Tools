version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: standard
  enable:
    - errorlint
    - gocritic
    - misspell
    - nilerr
    - revive
    # Правила безопасности и качества, включённые по итогам аудита.
    - dupl       # дублирующиеся блоки кода
    - exhaustive # неполный разбор значений перечисления
    - gocognit   # чрезмерная когнитивная сложность функции
    - gosec      # типовые проблемы безопасности
    - noctx      # сетевые вызовы без контекста
    - unparam    # параметры, которые всегда одинаковы
  settings:
    revive:
      rules:
        # analyze.AnalyzeLayers — намеренно описательное имя: «заикание» с именем пакета
        # здесь помогает читаемости, отключаем только эту проверку правила exported.
        - name: exported
          arguments:
            - checkPrivateReceivers
            - disableStutteringCheck
    dupl:
      threshold: 150
    gocognit:
      min-complexity: 30
    exhaustive:
      # Ветка default считается исчерпывающим разбором: правила анализа осознанно
      # возвращают общее поведение для неизвестных значений.
      default-signifies-exhaustive: true
    gosec:
      # G304 (файл по переменному пути) не нужен: cio пишет только туда, куда указал
      # пользователь флагом --output.
      excludes:
        - G304
  exclusions:
    generated: lax
    rules:
      # В тестах допускаем вольности: гонять те же правила, что и в коде, смысла нет.
      - path: _test\.go
        linters:
          - errcheck
          - gocritic
          - revive
          - dupl
          - gosec
          - gocognit
          - unparam

formatters:
  enable:
    - gofmt
    - goimports
