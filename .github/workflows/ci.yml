name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Новый пуш в ту же ветку отменяет предыдущий прогон: не тратим раннеры на устаревшие сборки.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PROJECT_DIR: Container image optimizer
  GO_CACHE_PATH: Container image optimizer/go.sum

jobs:
  lint:
    name: Линт
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Сторонние экшены фиксируются по SHA: тег можно переписать, коммит — нет.
      # Обновления приходят через Dependabot (.github/dependabot.yml).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Токен остаётся в .git/config иначе: он не нужен после checkout и попадает в артефакты.
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "Container image optimizer/go.mod"
          cache-dependency-path: ${{ env.GO_CACHE_PATH }}
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2
          working-directory: ${{ env.PROJECT_DIR }}

  vulncheck:
    name: Уязвимости зависимостей
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "Container image optimizer/go.mod"
          cache-dependency-path: ${{ env.GO_CACHE_PATH }}
      - name: govulncheck
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          # Версия зафиксирована: обновление — отдельное изменение, иначе сканер может
          # начать падать на новом наборе правил. Верхняя граница — версия Go в go.mod:
          # setup-go выставляет GOTOOLCHAIN=local, а golang.org/x/vuln@v1.8.0 требует
          # go >= 1.26.0 (в go.mod объявлена 1.25.4), поэтому ставится v1.7.0 —
          # её модуль требует go 1.25.0. Повышать версию — вместе с go в go.mod.
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          govulncheck ./...

  test:
    name: Тесты
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ${{ env.PROJECT_DIR }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "Container image optimizer/go.mod"
          cache-dependency-path: ${{ env.GO_CACHE_PATH }}
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./... -race -count=1 -covermode=atomic -coverprofile=coverage.out
      - name: Покрытие
        run: go tool cover -func=coverage.out | tail -n 1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: coverage
          path: ${{ env.PROJECT_DIR }}/coverage.out
          if-no-files-found: warn

  build:
    name: Сборка
    runs-on: ubuntu-latest
    needs: [test]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "Container image optimizer/go.mod"
          cache-dependency-path: ${{ env.GO_CACHE_PATH }}
      - name: Собрать cio
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          go build -trimpath -ldflags="-s -w -X main.version=${GITHUB_SHA::7}" -o bin/cio ./cmd/cio
          ./bin/cio --version
          ./bin/cio --help
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cio-linux-amd64
          path: ${{ env.PROJECT_DIR }}/bin/cio
          if-no-files-found: error

  docker:
    name: Docker-образ
    runs-on: ubuntu-latest
    needs: [build]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Собрать образ
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: "${{ env.PROJECT_DIR }}"
          push: false
          load: true
          tags: cio:ci
          build-args: |
            VERSION=dev
            REVISION=${{ github.sha }}
      - name: Проверить образ
        run: |
          docker run --rm cio:ci --version
          docker run --rm cio:ci --help
          docker image inspect cio:ci --format '{{index .Config.Labels "org.opencontainers.image.source"}}'
          # Образ обязан оставаться non-root: проверка ловит случайное возвращение к root.
          test "$(docker image inspect cio:ci --format '{{.Config.User}}')" = "cio"
