name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PROJECT_DIR: Container image optimizer
  GO_CACHE_PATH: Container image optimizer/go.sum

jobs:
  lint:
    name: Линт
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: "Container image optimizer/go.mod"
          cache-dependency-path: ${{ env.GO_CACHE_PATH }}
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          working-directory: ${{ env.PROJECT_DIR }}

  test:
    name: Тесты
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.PROJECT_DIR }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: "Container image optimizer/go.mod"
          cache-dependency-path: ${{ env.GO_CACHE_PATH }}
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./... -race -count=1 -covermode=atomic -coverprofile=coverage.out
      - name: Покрытие
        run: go tool cover -func=coverage.out | tail -n 1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: ${{ env.PROJECT_DIR }}/coverage.out
          if-no-files-found: warn

  build:
    name: Сборка
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: "Container image optimizer/go.mod"
          cache-dependency-path: ${{ env.GO_CACHE_PATH }}
      - name: Собрать cio
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          go build -trimpath -ldflags="-s -w -X main.version=${GITHUB_SHA::7}" -o bin/cio ./cmd/cio
          ./bin/cio --version
          ./bin/cio --help
      - uses: actions/upload-artifact@v7
        with:
          name: cio-linux-amd64
          path: ${{ env.PROJECT_DIR }}/bin/cio
          if-no-files-found: error

  docker:
    name: Docker-образ
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4.4.1
      - name: Собрать образ
        uses: docker/build-push-action@v7.4.0
        with:
          context: "${{ env.PROJECT_DIR }}"
          push: false
          load: true
          tags: cio:ci
          build-args: |
            VERSION=dev
            REVISION=${{ github.sha }}
      - name: Проверить образ
        run: |
          docker run --rm cio:ci --version
          docker run --rm cio:ci --help
          docker image inspect cio:ci --format '{{index .Config.Labels "org.opencontainers.image.source"}}'
