name: Release

# Релиз запускается по тегу вида cio-v0.1.0 (схема тегов и чеклист — в CONTRIBUTING.md):
# собираются бинари для основных платформ, создаётся GitHub Release
# и публикуется образ в GitHub Packages (ghcr.io/devops-spb-ru/cio).
on:
  push:
    tags: ["cio-v*", "sqlbrc-v*"]

# Релизы не отменяем: прерывать публикацию артефактов нельзя.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Каталог нужен только job'у образа: у sqlbrc образа пока нет (поставка в контейнере — 0.3.0).
  PROJECT_DIR: Container image optimizer
  IMAGE: ghcr.io/devops-spb-ru/cio

jobs:
  # Инструменты перечислены отдельными job'ами: matrix недоступен в jobs.<id>.if,
  # поэтому тег фильтруется условием на job'е, а сами шаги вынесены в вызываемый workflow
  # (release-binaries.yml): они у инструментов одинаковые.
  binaries-cio:
    if: startsWith(github.ref_name, 'cio-v')
    permissions:
      contents: write
      # Нужны для attestation сборки (OIDC-токен и запись attestations).
      id-token: write
      attestations: write
    # Форма $/… — синтаксис «свой репозиторий»: в отличие от ./, он не зависит от
    # файлов рабочего каталога и учитывается политикой «всё закреплено» (audit zizmor).
    uses: $/.github/workflows/release-binaries.yml
    with:
      tool: cio
      dir: Container image optimizer
      tag_prefix: cio-v

  binaries-sqlbrc:
    if: startsWith(github.ref_name, 'sqlbrc-v')
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: $/.github/workflows/release-binaries.yml
    with:
      tool: sqlbrc
      dir: SQL backup restore clone
      tag_prefix: sqlbrc-v

  image:
    name: Образ в GitHub Packages
    runs-on: ubuntu-latest
    # На теге sqlbrc job'ы binaries-* пропускаются, а с ними и этот: образа у сервиса нет.
    needs: [binaries-cio]
    if: startsWith(github.ref_name, 'cio-v')
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
      # Ключи для cosign не нужны: подпись keyless через OIDC GitHub.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Войти в ghcr.io
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # В run-блоке нет подстановок github.*: их легко подменить (template-injection),
        # значения передаются переменными окружения.
        run: echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Собрать и опубликовать образ
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#cio-v}"
          tags=(--tag "${IMAGE}:${version}")
          # Тег latest двигаем только на стабильном релизе: у предрелиза (0.2.0-rc.1)
          # он не должен перекрывать последнюю рабочую версию.
          if [[ "$version" == *-* ]]; then
            echo "предрелиз $version: тег latest не обновляем"
          else
            tags+=(--tag "${IMAGE}:latest")
          fi
          # --sbom и --provenance кладут рядом с образом attestations: видно,
          # из каких исходников и как собран образ.
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --build-arg VERSION="$version" \
            --build-arg REVISION="${GITHUB_SHA}" \
            --provenance=true \
            --sbom=true \
            "${tags[@]}" \
            --push \
            "${PROJECT_DIR}"
      - name: Проверить пакет
        run: docker buildx imagetools inspect "${IMAGE}:${GITHUB_REF_NAME#cio-v}"
      - name: Установить cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Подписать образ (keyless)
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#cio-v}"
          digest=$(docker buildx imagetools inspect "${IMAGE}:${version}" --format '{{.Manifest.Digest}}')
          cosign sign --yes "${IMAGE}@${digest}"
          echo "подписан ${IMAGE}@${digest}"

