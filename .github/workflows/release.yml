name: Release

# Релиз запускается по тегу вида <инструмент>-vX.Y.Z (схема тегов и чеклист — в
# CONTRIBUTING.md): собираются бинари для основных платформ, создаётся GitHub Release,
# а образ инструмента публикуется в GitHub Packages (ghcr.io/devops-spb-ru/<инструмент>).
on:
  push:
    tags: ["cio-v*", "sqlbrc-v*"]

# Релизы не отменяем: прерывать публикацию артефактов нельзя.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Инструменты перечислены отдельными job'ами: matrix недоступен в jobs.<id>.if,
  # поэтому тег фильтруется условием на job'е, а сами шаги вынесены в вызываемые
  # workflow (release-binaries.yml и release-image.yml): они у инструментов одинаковые.
  binaries-cio:
    if: startsWith(github.ref_name, 'cio-v')
    permissions:
      contents: write
      # Нужны для attestation сборки (OIDC-токен и запись attestations).
      id-token: write
      attestations: write
    # Форма $/… — синтаксис «свой репозиторий»: в отличие от ./, он не зависит от
    # файлов рабочего каталога и учитывается политикой «всё закреплено» (audit zizmor).
    uses: $/.github/workflows/release-binaries.yml
    with:
      tool: cio
      dir: Container image optimizer
      tag_prefix: cio-v

  binaries-sqlbrc:
    if: startsWith(github.ref_name, 'sqlbrc-v')
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: $/.github/workflows/release-binaries.yml
    with:
      tool: sqlbrc
      dir: SQL backup restore clone
      tag_prefix: sqlbrc-v

  image-cio:
    if: startsWith(github.ref_name, 'cio-v')
    needs: [binaries-cio]
    permissions:
      contents: read
      packages: write
      # Ключи для cosign не нужны: подпись keyless через OIDC GitHub.
      id-token: write
    uses: $/.github/workflows/release-image.yml
    with:
      tool: cio
      dir: Container image optimizer
      tag_prefix: cio-v

  image-sqlbrc:
    if: startsWith(github.ref_name, 'sqlbrc-v')
    needs: [binaries-sqlbrc]
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: $/.github/workflows/release-image.yml
    with:
      tool: sqlbrc
      dir: SQL backup restore clone
      tag_prefix: sqlbrc-v

