name: Release image

# Публикация образа инструмента в GitHub Packages: multi-arch сборка, SBOM и
# provenance, подпись cosign в keyless-режиме. Шаги у инструментов одинаковые,
# поэтому они описаны здесь, а release.yml выбирает инструмент по тегу.
on:
  workflow_call:
    inputs:
      tool:
        description: "Имя инструмента: имя пакета в ghcr.io и каталог cmd/<tool>"
        required: true
        type: string
      dir:
        description: Каталог инструмента в репозитории (контекст сборки)
        required: true
        type: string
      tag_prefix:
        description: Префикс тега вместе с -v (например, cio-v)
        required: true
        type: string

permissions:
  contents: read

jobs:
  image:
    name: Образ в GitHub Packages (${{ inputs.tool }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
      # Ключи для cosign не нужны: подпись keyless через OIDC GitHub.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Войти в ghcr.io
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # В run-блоке нет подстановок github.*: их легко подменить (template-injection),
        # значения передаются переменными окружения.
        run: echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Собрать и опубликовать образ
        # Значения из inputs передаются переменными окружения: подстановки inputs.*
        # в run-блоке тоже подменяемы (template-injection).
        env:
          TOOL: ${{ inputs.tool }}
          TAG_PREFIX: ${{ inputs.tag_prefix }}
          PROJECT_DIR: ${{ inputs.dir }}
          IMAGE: ghcr.io/devops-spb-ru/${{ inputs.tool }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#"${TAG_PREFIX}"}"
          tags=(--tag "${IMAGE}:${version}")
          # Тег latest двигаем только на стабильном релизе: у предрелиза (0.2.0-rc.1)
          # он не должен перекрывать последнюю рабочую версию.
          if [[ "$version" == *-* ]]; then
            echo "предрелиз $version: тег latest не обновляем"
          else
            tags+=(--tag "${IMAGE}:latest")
          fi
          # --sbom и --provenance кладут рядом с образом attestations: видно,
          # из каких исходников и как собран образ.
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --build-arg VERSION="$version" \
            --build-arg REVISION="${GITHUB_SHA}" \
            --provenance=true \
            --sbom=true \
            "${tags[@]}" \
            --push \
            "${PROJECT_DIR}"
      - name: Проверить пакет
        env:
          IMAGE: ghcr.io/devops-spb-ru/${{ inputs.tool }}
          TAG_PREFIX: ${{ inputs.tag_prefix }}
        run: docker buildx imagetools inspect "${IMAGE}:${GITHUB_REF_NAME#"${TAG_PREFIX}"}"
      - name: Установить cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Подписать образ (keyless)
        env:
          IMAGE: ghcr.io/devops-spb-ru/${{ inputs.tool }}
          TAG_PREFIX: ${{ inputs.tag_prefix }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#"${TAG_PREFIX}"}"
          digest=$(docker buildx imagetools inspect "${IMAGE}:${version}" --format '{{.Manifest.Digest}}')
          cosign sign --yes "${IMAGE}@${digest}"
          echo "подписан ${IMAGE}@${digest}"
