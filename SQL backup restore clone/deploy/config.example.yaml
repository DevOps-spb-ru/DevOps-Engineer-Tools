# Конфигурация сервиса sqlbrc (бэкапы, восстановление и клонирование баз PostgreSQL 15).
#
# Установка (Debian 12):
#   install -d -m 0750 /etc/sqlbrc
#   install -m 0640 deploy/config.example.yaml /etc/sqlbrc/config.yaml
#   install -d -m 0750 -o sqlbrc -g sqlbrc /var/backups/sqlbrc /var/lib/sqlbrc
#
# После правки проверьте себя: sqlbrc doctor
# Путь к файлу задаётся флагом --config или переменной SQLBRC_CONFIG.

# Версия схемы конфига. Менять не нужно: несовместимые версии отвергаются явно.
schema_version: 1

server:
  # Интерфейс слушает LAN: сервер из README — 192.168.7.96, порт 8088 без reverse-proxy.
  listen: "0.0.0.0:8088"
  # TLS: включите его, если интерфейс доступен не только из доверенной подсети.
  # Без TLS и без allow_insecure сервис не запустится — это защита от случайного
  # открытия интерфейса всему офису.
  tls:
    cert_file: ""
    key_file: ""
  # allow_insecure: true — осознанное «слушаем LAN по HTTP». Так развёрнут сервер
  # из README (0.0.0.0:8088 без reverse-proxy), поэтому в образце режим включён.
  # Обязательное условие: порт закрыт на межсетевом экране за пределами своей
  # подсети — см. deploy/nftables/sqlbrc.nft. Если ограничить подсеть нельзя,
  # выключите allow_insecure и настройте tls.
  allow_insecure: true
  # read_only: true — режим «только просмотр»: операции изменения запрещены.
  read_only: false
  # Предел размера запроса: формы сервиса больших тел не передают.
  max_body_bytes: 1048576
  # Адрес сервиса в уведомлениях и в ссылках (необязательно).
  public_url: ""

auth:
  # Встроенные пользователи: сервис внутренний, доступ только у ответственных людей.
  # Хэш пароля (bcrypt, 60 символов, начинается с $2y$):
  #   htpasswd -bnBC 10 "" 'пароль' | tr -d ':\n'
  users:
    - login: admin
      password_bcrypt: "$2y$10$abcdefghijklmnopqrstuu0123456789abcdefghijklmnopqrstu"
  # Токены для API: по одному в строке, права root-уровня не выдаются.
  token_file: ""
  # Время жизни сессии и защита от подбора пароля.
  session_ttl: "12h"
  login_backoff: "1s"
  max_login_attempts: 5

postgres:
  # Режим 0.1.0 — sudo: утилиты запускаются через sudo -n -u postgres,
  # подключение идёт через локальный сокет с peer-аутентификацией.
  # Пароли не хранятся ни в этом файле, ни в командной строке.
  mode: "sudo"
  sudo_path: "/usr/bin/sudo"
  sudo_user: "postgres"
  # В Debian 12 файлы /usr/bin/pg_dump — ссылки на pg_wrapper (пакет postgresql-client-15).
  bin_dir: "/usr/bin"
  # Служебная база для запросов к каталогу PostgreSQL.
  database: "postgres"
  # Роль и пароль задаются только в режиме tcp (поставка в контейнере, 0.2.0):
  # в режиме sudo роль не применяется, владельцы объектов берутся из дампа.
  role: ""
  password_file: ""
  # Параллелизм pg_restore и предел времени на одну операцию.
  jobs: 4
  timeout: "2h"

storage:
  # Каталог бэкапов сервиса: отдельный подкаталог, а не /var/backups целиком —
  # политика хранения удаляет старые дампы, поэтому чужих файлов рядом быть
  # не должно. Доступ: пользователь сервиса sqlbrc и root.
  dir: "/var/backups/sqlbrc"
  # Служебные данные сервиса: журнал задач, аудит, служебные файлы (0700).
  state_dir: "/var/lib/sqlbrc"
  # Политика хранения: последние 7 бэкапов каждой базы (из README) и не старше 14 дней.
  keep_last: 7
  keep_days: 14
  # Ниже этого остатка новые бэкапы не создаются: иначе место кончится на середине
  # дампа и файл останется битым.
  min_free_space: "5GB"

databases:
  # Шаблон обслуживаемых баз: стенды вида <префикс>-<номер> (создаются в пайплайне),
  # например fse-1234, fssd-7, dops-fix-42. Номер в конце обязателен, а префикс
  # отделяет стенды от чужих баз кластера (prod, app), поэтому шаблон не должен
  # превращаться в «^.*$» — иначе сервис возьмёт чужую базу.
  # Стенды с другим именованием описываются своим шаблоном (например «^stand-[0-9]+$»).
  pattern: "^[a-z][a-z0-9]*(?:-[a-z0-9]+)*-[0-9]+$"
  # Базы, которые сервис не трогает даже при совпадении с шаблоном.
  protected:
    - postgres
    - template0
    - template1
  # Роль-владелец создаваемых баз.
  owner: "postgres"
  # Перед восстановлением снимается служебный бэкап: чистый restore без страховки
  # на стенде означает потерю данных.
  auto_backup_before_restore: true
  # Перед восстановлением активные подключения завершаются (pg_terminate_backend):
  # иначе pg_restore не сможет удалить объекты, которые кто-то держит.
  terminate_on_restore: true

jobs:
  # Сколько задач выполняется одновременно и сколько из них может идти по одной базе.
  max_parallel: 2
  max_per_db: 1
  # Сколько записей журнала задач хранить.
  retain: 200

logging:
  # debug, info, warn, error. Переопределяется флагом --log-level.
  level: "info"
  # text — для чтения человеком, json — для journald и сборщиков.
  format: "text"
